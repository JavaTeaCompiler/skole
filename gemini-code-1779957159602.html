<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksamensflukt!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
        }

        #game-canvas {
            background-color: #ecf0f1;
            border: 5px solid #34495e;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #score-display {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.3s;
            visibility: hidden;
        }

        #game-over-screen.active {
            opacity: 1;
            visibility: visible;
        }

        #game-over-screen h1 {
            color: #e74c3c;
            margin: 0 0 10px 0;
            font-size: 36px;
        }

        #game-over-screen p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: scale(0.95);
        }

        .instructions {
            margin-top: 20px;
            text-align: center;
            max-width: 400px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        
        <div id="ui-layer">
            <div id="score-display">Score: 0</div>
            
            <div id="game-over-screen">
                <h1>Felt i fella!</h1>
                <p id="final-score">Du ble distrahert. Score: 0</p>
                <button onclick="resetGame()">Prøv igjen</button>
            </div>
        </div>
    </div>

    <div class="instructions">
        <strong>Slik spiller du:</strong><br>
        Bruk <b>←</b> og <b>→</b> piltastene for å bytte felt. Unngå alle distraksjoner for å få toppkarakter på eksamen!
    </div>

    <script>
        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score-display");
        const gameOverScreen = document.getElementById("game-over-screen");
        const finalScoreText = document.getElementById("final-score");

        // Spillvariabler
        let animationId;
        let isGameOver = false;
        let score = 0;
        let gameSpeed = 4;
        let frameCount = 0;

        // Distraksjoner (Emoji og navn)
        const distractionsData = ["⛏️", "📸", "🛍️", "🍕", "🧀", "🍦", "📱", "📺", "🎮"];
        
        // Felter: 0 (venstre), 1 (midten), 2 (høyre)
        const laneWidth = canvas.width / 3;
        const getLaneX = (lane) => (lane * laneWidth) + (laneWidth / 2);

        // Spiller (Studenten)
        const player = {
            lane: 1, // Starter i midten
            y: canvas.height - 80,
            size: 40,
            emoji: "👨‍🎓"
        };

        // Liste over aktive distraksjoner
        let obstacles = [];

        // Håndter tastetrykk
        document.addEventListener("keydown", (e) => {
            if (isGameOver) return;
            if (e.key === "ArrowLeft" && player.lane > 0) {
                player.lane--;
            } else if (e.key === "ArrowRight" && player.lane < 2) {
                player.lane++;
            }
        });

        function spawnObstacle() {
            // Tilfeldig felt (0, 1, 2)
            const lane = Math.floor(Math.random() * 3);
            // Tilfeldig distraksjon
            const emoji = distractionsData[Math.floor(Math.random() * distractionsData.length)];
            
            obstacles.push({
                lane: lane,
                y: -50, // Starter over skjermen
                size: 40,
                emoji: emoji
            });
        }

        function update() {
            if (isGameOver) return;

            // Øk vanskelighetsgraden over tid
            gameSpeed += 0.002;
            frameCount++;

            // Spawn nye distraksjoner basert på fart
            if (frameCount % Math.max(20, Math.floor(80 - gameSpeed * 5)) === 0) {
                spawnObstacle();
            }

            // Oppdater distraksjoner
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += gameSpeed;

                // Kollisjonssjekk (enkel sirkel/boks kollisjon basert på felter)
                if (obs.lane === player.lane) {
                    // Sjekk Y-aksen
                    if (obs.y + obs.size > player.y && obs.y - obs.size < player.y) {
                        gameOver();
                    }
                }

                // Fjern distraksjoner som er utenfor skjermen og gi poeng
                if (obs.y > canvas.height + 50) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreDisplay.innerText = `Score: ${score}`;
                }
            }
        }

        function draw() {
            // Tøm skjermen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tegn felt-linjer
            ctx.strokeStyle = "rgba(189, 195, 199, 0.5)";
            ctx.lineWidth = 2;
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(laneWidth, 0); ctx.lineTo(laneWidth, canvas.height);
            ctx.moveTo(laneWidth * 2, 0); ctx.lineTo(laneWidth * 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Reset linjestil

            // Tegn spiller
            ctx.font = "50px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(player.emoji, getLaneX(player.lane), player.y);

            // Tegn distraksjoner
            obstacles.forEach(obs => {
                ctx.fillText(obs.emoji, getLaneX(obs.lane), obs.y);
            });
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function gameOver() {
            isGameOver = true;
            cancelAnimationFrame(animationId);
            finalScoreText.innerText = `Du ble distrahert! Score: ${score}`;
            gameOverScreen.classList.add("active");
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            gameSpeed = 5;
            frameCount = 0;
            obstacles = [];
            player.lane = 1;
            scoreDisplay.innerText = `Score: 0`;
            gameOverScreen.classList.remove("active");
            gameLoop();
        }

        // Start spillet
        resetGame();

    </script>
</body>
</html>
